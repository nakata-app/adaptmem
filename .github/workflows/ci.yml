name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
          pip install mypy
      # HF anonim istekleri GH runner IP'lerinde 429'a takiliyor (test_embed /
      # test_reindex_then_search flaky-fail). Modeli cache'le: bir kez inen
      # model sonraki kosularda HF'ye sorulmadan kullanilir. Cache post-step'i
      # job fail olsa da kaydeder, birkac kosuda oturur.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-minilm-l6-v2
      - name: Lint
        run: ruff check adaptmem tests
      - name: Type-check (mypy --strict)
        run: mypy --strict adaptmem
      - name: Test
        run: pytest -q --cov=adaptmem --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: adaptmem-py3.12
          fail_ci_if_error: false
