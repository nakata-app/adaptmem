apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adaptmem
  labels:
    app: adaptmem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adaptmem
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Scale up fast (single-encoder requests can spike), scale down slowly
    # (avoid restart-loops if traffic dips for a minute).
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
