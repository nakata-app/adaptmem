[project]
name = "adaptmem"
version = "0.6.0"
description = "One-shot domain adaptation for retrieval — beat your baseline with 200 lines of hard-negative mining."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "atakan" }]
keywords = ["retrieval", "embedding", "fine-tune", "domain-adaptation", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24",
  "sentence-transformers>=3.0",
  "datasets>=3.0",
  "accelerate>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
shell = ["argcomplete>=3.5"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "pydantic>=2.5", "slowapi>=0.1.9"]
telemetry = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.scripts]
adaptmem = "adaptmem.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaptmem*"]

[tool.setuptools.package-data]
adaptmem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# `[telemetry]` and `[shell]` extras are optional; lokalde / CI'da
# yüklü değil — mypy bu yüzden import-not-found atar. Override'la sustur.
module = ["opentelemetry.*", "argcomplete"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `requests` `[server]` extra üzerinden lazy import; types-requests CI'da
# yüklü ama bench venv'lerinde yok — iki environment'ta da temiz geçsin.
module = ["requests", "requests.*"]
ignore_missing_imports = true
