{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adaptmem.fullname" . }}-secret
  labels:
    {{- include "adaptmem.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.apiKey }}
  ADAPTMEM_API_KEY: {{ .Values.auth.apiKey | quote }}
  {{- end }}
  {{- if .Values.auth.apiKeysFile }}
  api-keys.json: {{ .Values.auth.apiKeysFile | quote }}
  {{- end }}
{{- end }}
